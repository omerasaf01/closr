[project]
name = "closr"
version = "0.1.0"
description = "Automated Digital Marketing Agent powered by LangChain, LangGraph, and MCP"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.40",
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.5.1",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.8.5",
    "langchain-text-splitters>=1.1.0",
    "langgraph>=1.2.0",
    "mcp>=1.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.29.2",
]

[project.scripts]
closr = "closr.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src", ".venv/lib/python3.14/site-packages"]
autoSearchPaths = true
useLibraryCodeForTypes = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


